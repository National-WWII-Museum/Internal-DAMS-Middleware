<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Records in Que{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/bulma.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body>
  <nav class="navbar is-dark" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
       <a class="navbar-item has-text-weight-bold" href="/">Records in Que</a>
    </div>
    <div class="navbar-menu is-active">
      <div class="navbar-start">
        <a class="navbar-item" href="/holding.csv">Download (CSV)</a>
      </div>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </section>
</body>
</html>
