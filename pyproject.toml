[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ww2-emu-netx-middleware"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "python-dotenv",
    "pyodbc",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
]

[tool.setuptools.packages.find]
include = ["middleware*", "api*", "common*"]

[tool.setuptools.package-data]
api = ["templates/*", "static/css/*"]
