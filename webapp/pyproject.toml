   [build-system]
   requires = ["setuptools>=61.0"]
   build-backend = "setuptools.build_meta"

   [project]
   name = "ww2-staging-viewer"
   version = "0.1.0"
   requires-python = ">=3.9"
   dependencies = [
       "fastapi",
       "uvicorn[standard]",
       "python-dotenv",
       "pyodbc",
       "jinja2",
   ]

   [tool.setuptools]
   packages = ["app"]